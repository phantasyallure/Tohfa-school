<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Candidatures — Administration Tohfa Oran</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="data:,">
<link href="https://fonts.googleapis.com/css2?family=Jost:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/admin/css/admin.css">
<link rel="stylesheet" href="/css/custom-select.css">
</head>
<body>

<div class="admin-shell">
  <aside class="admin-sidebar">
    <div class="login-brand">
      <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <path d="M50 6C74 6 90 26 90 50V94H10V50C10 26 26 6 50 6Z" fill="#6E1B33" stroke="#C7973F" stroke-width="4"/>
        <path d="M50 32L60 50L50 68L40 50Z" fill="#C7973F"/>
      </svg>
      <div>
        <strong>Tohfa Oran</strong>
        <span>Administration</span>
      </div>
    </div>
    <nav class="sidebar-nav">
      <a href="/admin/dashboard.html" class="active">
        <svg viewBox="0 0 24 24" fill="none"><path d="M4 12l8-8 8 8M6 10v10h12V10" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg>
        <span>Candidatures</span>
      </a>
      <a href="/admin/appearance.html">
        <svg viewBox="0 0 24 24" fill="none"><path d="M4 16l4.6-5.4a2 2 0 0 1 2.9-.1L15 14l1.6-1.8a2 2 0 0 1 2.9 0L21 14" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><rect x="3" y="4" width="18" height="16" rx="2" stroke="currentColor" stroke-width="1.8"/><circle cx="8.5" cy="8.5" r="1.4" fill="currentColor"/></svg>
        <span>Apparence du site</span>
      </a>
      <a href="/" target="_blank" rel="noopener">
        <svg viewBox="0 0 24 24" fill="none"><path d="M14 4h6v6M20 4L10 14M8 4H5a1 1 0 0 0-1 1v14a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-3" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <span>Voir le site</span>
      </a>
      <button type="button" id="logout-btn">
        <svg viewBox="0 0 24 24" fill="none"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <span>Se déconnecter</span>
      </button>
    </nav>
    <p class="sidebar-foot" id="admin-email-tag"></p>
  </aside>

  <main class="admin-main">
    <div class="admin-topbar">
      <div>
        <h1>Candidatures</h1>
        <p>Toutes les demandes d'inscription reçues via le site.</p>
      </div>
      <button type="button" class="btn-refresh" id="refresh-btn">Actualiser</button>
    </div>

    <div class="stat-row" id="stat-row">
      <div class="stat-card is-total">
        <div class="stat-icon"><svg viewBox="0 0 24 24" fill="none"><path d="M4 19V6a2 2 0 0 1 2-2h9l5 5v10a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2Z" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/><path d="M8 12h8M8 16h5" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg></div>
        <div><div class="num" id="stat-total">—</div><div class="label">Total</div></div>
      </div>
      <div class="stat-card is-recent">
        <div class="stat-icon"><svg viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="8.5" stroke="currentColor" stroke-width="1.7"/><path d="M12 7v5l3.5 2" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
        <div><div class="num" id="stat-new">—</div><div class="label">Nouvelles (7 jours)</div></div>
      </div>
      <div class="stat-card is-nouveau">
        <div class="stat-icon"><svg viewBox="0 0 24 24" fill="none"><path d="M12 3l1.9 4.5L18 9l-4.1 1.5L12 15l-1.9-4.5L6 9l4.1-1.5Z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/><path d="M18 15l.9 2.1L21 18l-2.1.9L18 21l-.9-2.1L15 18l2.1-.9Z" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/></svg></div>
        <div><div class="num" id="stat-nouveau">—</div><div class="label">Statut : nouveau</div></div>
      </div>
      <div class="stat-card is-inscrit">
        <div class="stat-icon"><svg viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="9.5" stroke="currentColor" stroke-width="1.7"/><path d="M8 12.5l2.5 2.5L16 9" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
        <div><div class="num" id="stat-inscrit">—</div><div class="label">Statut : inscrit</div></div>
      </div>
    </div>

    <div class="table-toolbar">
      <input type="search" id="search-input" placeholder="Rechercher un nom, téléphone, email...">
      <select id="status-filter" data-tsel>
        <option value="">Tous les statuts</option>
        <option value="nouveau">Nouveau</option>
        <option value="contacte">Contacté</option>
        <option value="inscrit">Inscrit</option>
        <option value="refuse">Refusé</option>
      </select>
    </div>

    <div class="table-wrap">
      <div id="table-slot">
        <div class="loading-state">Chargement des candidatures...</div>
      </div>
    </div>
  </main>
</div>

<script src="/js/supabase-config.js" defer></script>
<script src="/js/custom-select.js" defer></script>
<script type="module" src="/admin/js/admin-dashboard.js"></script>
</body>
</html>
